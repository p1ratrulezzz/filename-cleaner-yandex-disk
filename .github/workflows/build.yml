name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --verbose --no-default-features

  create-release:
    name: Create Release
    needs: test
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release with notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.artifact }}
    needs: [test, create-release]
    if: always() && needs.test.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: filename_cleaner-windows-amd64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: filename_cleaner-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: filename_cleaner-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GTK deps (for folder dialog)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libglib2.0-dev pkg-config
          # Find glib-2.0.pc and export its directory for later steps
          PC_DIR=$(dirname "$(find /usr -name 'glib-2.0.pc' 2>/dev/null | head -1)")
          echo "Found glib-2.0.pc in: $PC_DIR"
          echo "PKG_CONFIG_PATH=$PC_DIR" >> "$GITHUB_ENV"
          pkg-config --modversion glib-2.0 || true

      - name: Run tests before build
        run: cargo test --verbose --no-default-features

      - name: Build release (with GUI dialog)
        run: cargo build --release --target ${{ matrix.target }} --features gui
        env:
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}

      - name: Prepare artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cp target/${{ matrix.target }}/release/filename_cleaner ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item "target\${{ matrix.target }}\release\filename_cleaner.exe" "${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          # Только файлы. Notes уже созданы job'ом create-release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS universal DMG
    needs: [test, create-release]
    if: always() && needs.test.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Run tests before build
        run: cargo test --verbose --no-default-features

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin --features gui

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin --features gui

      - name: Create universal binary with lipo
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/filename_cleaner \
            target/x86_64-apple-darwin/release/filename_cleaner \
            -output filename_cleaner
          chmod +x filename_cleaner
          lipo -info filename_cleaner
          file filename_cleaner

      - name: Package into DMG
        run: |
          rm -rf dmg_staging filename_cleaner-macos-universal.dmg
          mkdir -p dmg_staging
          cp filename_cleaner dmg_staging/
          # Небольшая инструкция внутри образа
          printf '%s\n' \
            'Filename Cleaner' \
            '' \
            'Universal binary (Apple Silicon + Intel).' \
            'Запуск: ./filename_cleaner' \
            'Или перетащите в /usr/local/bin или ~/bin.' \
            > dmg_staging/README.txt
          hdiutil create \
            -volname "Filename Cleaner" \
            -srcfolder dmg_staging \
            -ov \
            -format UDZO \
            filename_cleaner-macos-universal.dmg
          ls -lh filename_cleaner-macos-universal.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: filename_cleaner-macos-universal.dmg
          path: filename_cleaner-macos-universal.dmg

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: filename_cleaner-macos-universal.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
